name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printenv PROD_SSH_KEY > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan mygreed.co.za >> ~/.ssh/known_hosts
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.2.1565

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ hashFiles('deps.edn') }}
          restore-keys: clj-

      - name: Build CSS
        run: |
          set -e
          clojure -P -M:dev
          clojure -M:dev css --minify
        env:
          CLJ_JVM_OPTS: "-XX:-OmitStackTraceInFastThrow"

      - name: Upload CSS
        run: scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/prod_key target/resources/public/css/main.css app@mygreed.co.za:/home/app/target/resources/public/css/main.css

      - name: Push to prod
        run: |
          git remote add prod ssh://app@mygreed.co.za/home/app/repo.git
          git push prod master
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes
